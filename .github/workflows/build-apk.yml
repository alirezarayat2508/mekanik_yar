name: Build MechanicYar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o MechanicYar_Android_Project_NEW.zip -d extracted

      - name: Build APK
        working-directory: extracted/MechanicYar_Android_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MechanicYar-APK
          path: extracted/MechanicYar_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
